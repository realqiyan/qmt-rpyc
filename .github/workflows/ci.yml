name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  client:
    name: Client Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e . pytest
      - run: bash scripts/test.sh

  server:
    name: Server ${{ matrix.os }} Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[server]" pytest
      - run: python -m pytest tests/ -v -k "not live"

  macos:
    name: macOS client smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_protocol.py tests/test_proxy.py tests/test_config.py tests/test_cli.py -v
      - run: qmt-rpyc-client --help

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import qmt_rpyc; print(qmt_rpyc.__version__)"
      - run: qmt-rpyc-client --help
      - run: qmt-rpyc-server --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
