name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c "exec(open('src/qmt_rpyc/version.py').read()); print(__version__)")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Build Windows bootstrap bundle
        run: |
          mkdir -p release/qmt-rpyc-windows
          cp install-server.bat start-rpyc.bat README.md README.en.md LICENSE .env.example release/qmt-rpyc-windows/
          cp dist/*.whl release/qmt-rpyc-windows/
          cd release
          zip -r "qmt-rpyc-${GITHUB_REF_NAME}-windows.zip" qmt-rpyc-windows
          cd ..
          sha256sum dist/* release/*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            dist/*
            release/*.zip
            SHA256SUMS

  publish-python:
    needs: [test, github-release]
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish release candidate to TestPyPI
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish stable release to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
